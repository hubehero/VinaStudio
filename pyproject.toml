[project]
name = "vinastudio"
version = "0.6.4"
description = "Modern desktop workbench for AutoDock Vina docking, built with PySide6 + Vue 3"
readme = "README.en.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "hubehero" }, { name = "VinaStudio Contributors" }]
keywords = ["molecular-docking", "autoDock-vina", "computational-chemistry", "drug-discovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
project_urls = [
    "Homepage = https://github.com/hubehero/VinaStudio",
    "Documentation = https://github.com/hubehero/VinaStudio#readme",
    "Repository = https://github.com/hubehero/VinaStudio",
    "Issues = https://github.com/hubehero/VinaStudio/issues",
]

dependencies = [
    # Desktop shell
    "pyside6>=6.7",
    # Local API server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    # Docking engine + molecular toolkit
    # No `vina` wheel exists for Windows, and there is nothing to build: the
    # packaged command-line backend covers that platform, so the module is only
    # required where it can actually be installed.
    "vina>=1.2.7; sys_platform != 'win32'",
    "meeko>=0.7.1",
    "rdkit>=2024.3.1",
    "numpy>=1.26",
    "scipy>=1.13",
    "gemmi>=0.7.5",
    # The update check fetches GitHub over TLS; a frozen build needs an
    # explicit CA bundle instead of relying on the interpreter's default.
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[project.scripts]
vinastudio = "vinastudio.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vinastudio"]

[tool.hatch.build.targets.wheel.force-include]
"vinastudio/server/static" = "vinastudio/server/static"

# The wheel can also be built from the sdist (uv's default `uv build`, and
# any pip install from sdist).  gitignore keeps the built assets out of the
# sdist, which would leave force-include pointing at a missing directory —
# ship the assets in the sdist too so both paths stay buildable.
[tool.hatch.build.targets.sdist.force-include]
"vinastudio/server/static" = "vinastudio/server/static"

[tool.ruff]
line-length = 100
target-version = "py312"
# vina_simple is a nested, separately-versioned repo with its own tooling;
# the root lint must not police it (coordinator ruling, TASK-22).
exclude = ["web", "vinastudio/server/static", ".venv", "vina_simple"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]
ignore = [
    "E501",
    # The interface ships Chinese text, where full-width punctuation is correct.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency markers are argument defaults by design, not
# mutable-default bugs.
"vinastudio/server/**" = ["B008"]
