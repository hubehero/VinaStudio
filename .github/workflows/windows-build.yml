name: Windows build

# Build the Windows desktop package — PyInstaller bundle plus Inno Setup
# installer — and upload it as an artifact.
#
# release.yml calls this workflow for a tag, so the installer is attached to the
# release automatically. It can also be dispatched on its own for a test build.
# Nothing here publishes on its own: the release job owns that step.

on:
  workflow_dispatch:
  workflow_call:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: |
          # hatchling's force-include names vinastudio/server/static, so the
          # directory has to exist before the project can be installed; the
          # frontend build fills it afterwards.
          New-Item -ItemType Directory -Force -Path vinastudio/server/static | Out-Null
          New-Item -ItemType File -Force -Path vinastudio/server/static/.gitkeep | Out-Null
          python -m pip install --upgrade pip setuptools wheel
          # Resolves on Windows: `vina` carries a `sys.platform != "win32"` marker
          # because no wheel exists for it — the command-line backend, which the
          # bundle below carries, covers docking instead.
          python -m pip install -e ".[dev]" pyinstaller cairosvg pillow

      - name: Build frontend
        run: |
          pnpm -C web install --frozen-lockfile
          python scripts/build_web.py --skip-install

      - name: Generate icons
        run: python packaging/ci/generate_icons.py

      - name: Fetch the Vina binary
        run: python scripts/fetch_vina_cli.py

      - name: Build with PyInstaller
        run: pyinstaller packaging/pyinstaller/vinastudio.spec --noconfirm

      # The bundle is only useful on Windows if the engine actually travelled with
      # it and still runs there, so this is checked rather than assumed.
      - name: Check the bundle carries a working engine
        run: |
          $binary = "dist/vinastudio/_internal/vinastudio/resources/vina/vina.exe"
          if (-not (Test-Path $binary)) { throw "the engine binary is not in the bundle" }
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw "the bundled engine does not run" }

      # The failure seen on a real machine was "Failed to load Python DLL
      # ...\_internal\python312.dll" — the one file the launcher cannot start
      # without — so its presence is checked rather than assumed.
      - name: Check the bundle carries the Python runtime
        run: |
          $dll = "dist/vinastudio/_internal/python312.dll"
          if (-not (Test-Path $dll)) { throw "python312.dll is missing from the bundle" }
          Write-Host ("python312.dll: {0:N1} MB" -f ((Get-Item $dll).Length / 1MB))

          # Windows supplies the UCRT and its API-set forwarders; copies inside
          # `_internal` shadow them and the app then cannot load its own runtime. The
          # spec filters these out, and this keeps a future dependency from quietly
          # putting them back.
          $stubs = @(Get-ChildItem "dist/vinastudio/_internal/api-ms-win-*.dll", `
                                     "dist/vinastudio/_internal/ext-ms-win-*.dll" `
                                     -ErrorAction SilentlyContinue)
          $ucrt = Get-Item "dist/vinastudio/_internal/ucrtbase.dll" -ErrorAction SilentlyContinue
          if ($stubs.Count -gt 0 -or $ucrt) {
            throw "the bundle ships system runtime copies: $($stubs.Count) API-set stub(s), ucrtbase: $([bool]$ucrt)"
          }
          Write-Host "OK: no shadowing copies of the system runtime"

          # Two DLLs with one basename means one of them silently wins and the loser's
          # consumer fails on import — "Invalid access to memory location" or "The
          # specified module could not be found", depending on which copy wins. The
          # spec collapses the C++ runtime to a single root copy; assert that landed and
          # that nothing else collides.
          $root = (Resolve-Path "dist/vinastudio/_internal").Path
          $dups = @(Get-ChildItem -Recurse -File "dist/vinastudio/_internal" -Filter *.dll |
            Group-Object Name | Where-Object { $_.Count -gt 1 })
          if ($dups.Count -gt 0) {
            foreach ($d in $dups) {
              $where = ($d.Group.FullName | ForEach-Object { $_.Replace($root, "") }) -join " | "
              Write-Host ("  duplicate {0} x{1}: {2}" -f $d.Name, $d.Count, $where)
            }
            throw "the bundle has duplicated DLL basenames; one copy silently wins"
          }
          Write-Host "OK: no duplicated DLL basenames"

          # The C++ runtime must be present, once, at the root: `_ssl.pyd` imports it
          # directly and the frozen importer resolves that without consulting PATH.
          foreach ($name in @("VCRUNTIME140.dll", "msvcp140.dll")) {
            $path = Join-Path $root $name
            if (-not (Test-Path $path)) { throw "$name is missing from the bundle root" }
          }
          Write-Host "OK: the C++ runtime sits at the bundle root"

          # `_ssl.pyd` is where this bundle kept dying, so name its dependencies and
          # assert each resolves — either in the bundle or as a Windows system DLL.
          python -m pip install --quiet pefile
          $probe = @'
          import os, sys, pefile
          internal = sys.argv[1]
          ssl = os.path.join(internal, "_ssl.pyd")
          if not os.path.exists(ssl):
              print("_ssl.pyd is absent from the bundle"); sys.exit(1)
          p = pefile.PE(ssl, fast_load=True); p.parse_data_directories()
          need = sorted(i.dll.decode() for i in p.DIRECTORY_ENTRY_IMPORT)
          print("_ssl.pyd imports:", ", ".join(need))
          # api-ms-win-*/ext-ms-win-* are API-set names the Windows loader resolves
          # through the apiset schema, not files on disk, so they are not "missing".
          virtual = ("api-ms-win-", "ext-ms-win-")
          concrete = [n for n in need if not n.lower().startswith(virtual)]
          system = os.path.join(os.environ["SystemRoot"], "System32")
          missing = [n for n in concrete
                     if not os.path.exists(os.path.join(internal, n))
                     and not os.path.exists(os.path.join(system, n))]
          if missing:
              print("MISSING from both the bundle and System32:", missing)
              sys.exit(1)
          print("OK: every _ssl.pyd dependency resolves")
          '@
          python -c $probe (Resolve-Path "dist/vinastudio/_internal").Path
          if ($LASTEXITCODE -ne 0) { throw "a dependency of _ssl.pyd cannot be resolved" }

          # A file exists and looks the right size, yet LoadLibrary still fails: the
          # loader reads the BASERELOC directory, and GNU strip's PE back-end rewrites
          # that size to the entire section. The walk then leaves the real block chain,
          # reads the section's zero padding as a block of size 0, and raises error 998
          # ("Invalid access to memory location"). So walk the tables, do not measure
          # the files. Images without relocations are legitimate and skipped.
          $reloc = @'
          import os, sys, struct, pefile

          internal = sys.argv[1]

          def reloc_walk(path):
              """Return (block_count, problem) for a PE's relocation directory."""
              pe = pefile.PE(path, fast_load=True); pe.parse_data_directories()
              directory = pe.OPTIONAL_HEADER.DATA_DIRECTORY[
                  pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_BASERELOC"]]
              if not directory.Size:
                  return None, None
              data = pe.get_data(directory.VirtualAddress, directory.Size)
              offset, blocks = 0, 0
              while offset + 8 <= len(data):
                  block_size = struct.unpack_from("<I", data, offset + 4)[0]
                  if block_size < 8:
                      return blocks, "block of size {0} at +{1}".format(block_size, offset)
                  blocks += 1
                  offset += block_size
              if offset != len(data):
                  return blocks, "table ends at +{0} of a {1}-byte directory".format(offset, len(data))
              return blocks, None

          problems = 0
          for name in ("python312.dll", "_ssl.pyd", "libcrypto-3.dll", "libssl-3.dll"):
              path = os.path.join(internal, name)
              if not os.path.exists(path):
                  print("  {0}: absent, skipped".format(name))
                  continue
              blocks, problem = reloc_walk(path)
              if problem:
                  print("  {0}: MALFORMED relocation table -- {1}".format(name, problem))
                  problems += 1
              elif blocks is None:
                  print("  {0}: no base relocations, skipped".format(name))
              else:
                  print("  {0}: {1} relocation blocks, table is clean".format(name, blocks))
          sys.exit(1 if problems else 0)
          '@
          python -c $reloc (Resolve-Path "dist/vinastudio/_internal").Path
          if ($LASTEXITCODE -ne 0) { throw "a bundled DLL has a malformed relocation table" }

          Write-Host "--- OpenSSL and C++ runtime copies"
          Get-ChildItem -Recurse -File "dist/vinastudio/_internal" |
            Where-Object { $_.Name -match "^(libcrypto|libssl|msvcp140|vcruntime140)" } |
            ForEach-Object {
              Write-Host ("  {0}  {1:N0} bytes  [{2}]" -f $_.Name, $_.Length, $_.FullName.Replace($root, ""))
            }

      # Then let the packaged application answer for itself.
      #
      # The port comes from the OS, not from a log line: this is a windowed build, so
      # stderr is not a console, and a StreamHandler pointed at a missing stream is
      # exactly the kind of thing that silently swallows the evidence. stdout/stderr
      # are redirected anyway so the child gets valid handles.
      #
      # That redirection is also why the first real user met a defect this job could
      # not: a GUI process has no console, so PyInstaller leaves sys.stdout/stderr as
      # None there, and the runner's valid handles hid it. The app asks for the
      # console-less condition instead of hoping to inherit it.
      - name: Start the packaged app and ask it for its backend
        run: |
          $appHome = Join-Path $env:TEMP "vinastudio-ci"
          $env:VINASTUDIO_HOME = $appHome
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:VINASTUDIO_SIMULATE_NO_CONSOLE = "1"
          $out = Join-Path $env:TEMP "vinastudio-ci.out"
          $err = Join-Path $env:TEMP "vinastudio-ci.err"
          $proc = Start-Process -FilePath "dist/vinastudio/vinastudio.exe" `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          try {
            $port = $null
            foreach ($attempt in 1..90) {
              Start-Sleep -Seconds 2
              if ($proc.HasExited) { throw "the packaged app exited early (code $($proc.ExitCode))" }
              $listening = Get-NetTCPConnection -State Listen -OwningProcess $proc.Id `
                -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($listening) { $port = $listening.LocalPort; break }
            }
            if (-not $port) { throw "the app never opened a listening port within three minutes" }

            $info = Invoke-RestMethod "http://127.0.0.1:$port/api/system/info"
            Write-Host ("backend={0} reason={1} cliAvailable={2}" -f `
              $info.docking.backend, $info.docking.reasonCode, $info.docking.cliAvailable)
            if ($info.docking.backend -ne "vina-cli") {
              throw "Windows should fall back to the binary; got $($info.docking.backend)"
            }

            # `backend` alone is not what the user sees. The capability page reads
            # the self-check, and the shipped build told CLI-backed users their
            # installation was missing "vina" — true about the import, false about
            # the capability. Assert the verdict the page renders, in the frozen
            # build, where the module really is unimportable.
            $check = Invoke-RestMethod "http://127.0.0.1:$port/api/system/selfcheck"
            Write-Host ("dockingAvailable={0} dockingMissing=[{1}] failed=[{2}]" -f `
              $check.dockingAvailable, ($check.dockingMissing -join ","), ($check.failed -join ","))
            if (-not $check.dockingAvailable) {
              throw "the frozen build reported docking unavailable (failed: $($check.failed -join ', '))"
            }
            if ($check.dockingMissing.Count -ne 0) {
              throw "the frozen build named a docking dependency as missing: $($check.dockingMissing -join ', ')"
            }
            if ($check.failed -notcontains "vina") {
              throw "expected the vina module to be unimportable here, so this check stops proving anything"
            }

            # A real docking job, not just a capability probe. The worker is a
            # spawn child launched by the packaged exe itself, so this is the only
            # assertion that can catch a frozen entry point re-running the GUI
            # instead of the worker, or a worker that assumes a console
            # (TASK-40 §11.1/§11.2). The bundle already carries prepared 1iep
            # PDBQTs; exhaustiveness 1 keeps it to a few seconds.
            $sample = (Resolve-Path "dist/vinastudio/_internal/vinastudio/resources/sample/1iep").Path
            $receptor = Join-Path $sample "1iep_receptor.pdbqt"
            $ligand = Join-Path $sample "1iep_ligand.pdbqt"
            foreach ($file in @($receptor, $ligand)) {
              if (-not (Test-Path $file)) { throw "bundled 1iep sample missing: $file" }
            }
            $dockBody = @{
              receptorPath = $receptor
              ligandPath = $ligand
              center = @(15.190, 53.903, 16.917)
              size = @(20.0, 20.0, 20.0)
              scoring = "vina"
              exhaustiveness = 1
              nPoses = 1
              cpu = 1
              seed = 42
              verbosity = 1
            } | ConvertTo-Json -Depth 4
            $dockJob = Invoke-RestMethod -Method Post `
              -Uri "http://127.0.0.1:$port/api/docking/start" `
              -ContentType "application/json" -Body $dockBody
            Write-Host "started docking job $($dockJob.jobId)"

            $dockStatus = $null
            foreach ($attempt in 1..90) {
              Start-Sleep -Seconds 2
              $dockStatus = Invoke-RestMethod "http://127.0.0.1:$port/api/docking/jobs/$($dockJob.jobId)"
              if ($dockStatus.status -in @("completed", "failed", "cancelled")) { break }
            }
            if ($null -eq $dockStatus -or $dockStatus.status -ne "completed") {
              $state = if ($null -eq $dockStatus) { "no status" } else {
                "status=$($dockStatus.status) progress=$($dockStatus.progress) stage=$($dockStatus.stage) error=$($dockStatus.error)"
              }
              $tail = if ($null -eq $dockStatus) { "" } else {
                ($dockStatus.log | Select-Object -Last 8) -join " | "
              }
              throw "docking did not complete: $state log=$tail"
            }

            $dockResult = Invoke-RestMethod "http://127.0.0.1:$port/api/docking/jobs/$($dockJob.jobId)/result"
            if ($dockResult.poses.Count -lt 1) { throw "docking completed with no poses" }
            if ($dockResult.bestAffinity -ge 0) {
              throw "docking returned a non-negative affinity: $($dockResult.bestAffinity)"
            }
            Write-Host ("docking OK: best={0:N3} kcal/mol poses={1} elapsed={2} ms" -f `
              $dockResult.bestAffinity, $dockResult.poses.Count, $dockResult.elapsedMs)

            Write-Host "OK: the packaged application starts and finds its own engine"
          } catch {
            # Explain the failure instead of only reporting it.
            Write-Host "--- failure: $($_.Exception.Message)"
            Write-Host "--- process alive: $(if ($proc.HasExited) { 'no' } else { 'yes' })"
            Write-Host "--- main window title: '$($proc.MainWindowTitle)'"
            if ($dockJob) {
              try {
                $s = Invoke-RestMethod "http://127.0.0.1:$port/api/docking/jobs/$($dockJob.jobId)"
                Write-Host "--- docking job $($dockJob.jobId): $($s.status) $($s.progress)% stage=$($s.stage) error=$($s.error)"
                $s.log | Select-Object -Last 20 | ForEach-Object { Write-Host "    $_" }
              } catch {
                Write-Host "--- could not read docking job: $($_.Exception.Message)"
              }
            }
            Write-Host "--- recent application events"
            Get-WinEvent -LogName Application -MaxEvents 8 -ErrorAction SilentlyContinue |
              Format-List TimeCreated, ProviderName, Message
            Get-ChildItem -Recurse -Force $appHome -ErrorAction SilentlyContinue |
              Select-Object -First 30 FullName
            foreach ($path in @($out, $err, (Join-Path $appHome "logs\vinastudio.log"))) {
              if (Test-Path $path) {
                Write-Host "--- $path"
                Get-Content $path -Tail 40
              } else {
                Write-Host "--- $path (absent)"
              }
            }
            throw
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      # A windowed build explains itself with a message box, which is invisible here
      # and waits for a click. So when it does not come up, build the same bundle as a
      # console application and read what it actually says: that text is the
      # difference between guessing and knowing.
      - name: Read the fatal error from a console build
        if: failure()
        run: |
          $env:VINASTUDIO_CONSOLE_BUILD = "1"
          pyinstaller packaging/pyinstaller/vinastudio.spec --noconfirm `
            --distpath dist-console --workpath build-console 2>&1 | Select-Object -Last 3
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:VINASTUDIO_HOME = Join-Path $env:TEMP "vinastudio-console"
          $out = Join-Path $env:TEMP "console.out"
          $err = Join-Path $env:TEMP "console.err"
          $proc = Start-Process -FilePath "dist-console/vinastudio/vinastudio.exe" `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          Start-Sleep -Seconds 45
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          Write-Host "--- console build stdout"
          Get-Content $out -Tail 40 -ErrorAction SilentlyContinue
          Write-Host "--- console build stderr"
          Get-Content $err -Tail 40 -ErrorAction SilentlyContinue

      # "Failed to load Python DLL" says the file exists and the loader refused it.
      # Two questions separate the cases: can a working Python load this exact file,
      # and what is inside it (machine type, section names, imports)?
      - name: Inspect the Python runtime the bundle carries
        if: failure()
        run: |
          $dll = (Resolve-Path "dist/vinastudio/_internal/python312.dll").Path
          Write-Host "--- can the host Python load it?"
          python -c "import ctypes, sys; ctypes.WinDLL(sys.argv[1]); print('loaded:', sys.argv[1])" $dll
          python -m pip install --quiet pefile
          $probe = @'
          import pefile, sys
          p = pefile.PE(sys.argv[1], fast_load=True)
          p.parse_data_directories()
          print("machine:", hex(p.FILE_HEADER.Machine))
          print("sections:", [s.Name.rstrip(b"\x00").decode() for s in p.sections])
          print("imports:", sorted(i.dll.decode() for i in p.DIRECTORY_ENTRY_IMPORT))
          '@
          python -c $probe $dll
          Write-Host "--- DLLs shipped beside it (first 12)"
          Get-ChildItem dist/vinastudio/_internal/*.dll |
            Select-Object -First 12 -Property Name, Length | Format-Table -AutoSize

      - name: Compile the installer
        run: |
          # Inno Setup ships on the runner image; only fetch it if it is missing.
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }
          $version = (python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } else {
            $iscc = "iscc"
          }
          & $iscc "/DVERSION=$version" "packaging/windows/vinastudio.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Report the artifact
        run: |
          Get-ChildItem dist/vinastudio-*-setup.exe |
            Select-Object Name, @{N="MB";E={[math]::Round($_.Length / 1MB, 1)}}

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/vinastudio-*-setup.exe
          if-no-files-found: error
