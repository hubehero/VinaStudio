name: Quality

# The release tree intentionally does not ship the test suite (`.gitignore`
# excludes `tests/`), so this workflow checks what does ship: Python lint, the
# interface's type check and the frozen install inputs. Full pytest runs belong
# to the development tree's CI; see exchange/ROADMAP-2026-Q4.md, TASK-42.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Lint Python
        # Pinned so a new ruff release cannot turn the gate red without a change
        # in this repository. Bump it deliberately with the next dependency pass.
        run: uvx ruff@0.16.8 check .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install interface dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Type-check the interface
        run: pnpm -C web typecheck

      - name: Unit-test the interface
        run: pnpm -C web test
