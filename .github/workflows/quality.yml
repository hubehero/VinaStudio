name: Quality

# The release tree intentionally does not ship the test suite (`.gitignore`
# excludes `tests/`), so this workflow checks what does ship: Python lint, the
# interface's type check and the frozen install inputs. Full pytest runs belong
# to the development tree's CI; see exchange/ROADMAP-2026-Q4.md, TASK-42.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Lint Python
        # Pinned so a new ruff release cannot turn the gate red without a change
        # in this repository. Bump it deliberately with the next dependency pass.
        run: uvx ruff@0.17.1 check .

      - name: Prepare static directory
        # The release tree does not track the empty static directory, but
        # hatchling's force-include requires it before the editable install.
        run: mkdir -p vinastudio/server/static

      - name: Install backend dependencies
        run: uv sync --extra dev

      - name: Backend API smoke
        # The release tree intentionally omits tests/; this checks the public
        # backend contract without Qt, network, or a full docking run.
        run: uv run python validation/ci/smoke.py

      - name: Check benchmark data policy
        run: uv run python scripts/check_benchmark_policy.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install interface dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Type-check the interface
        run: pnpm -C web typecheck

      - name: Unit-test the interface
        run: pnpm -C web test

      - name: Install Playwright Chromium
        run: pnpm -C web exec playwright install --with-deps chromium

      - name: Browser smoke
        run: pnpm -C web e2e
