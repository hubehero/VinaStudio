name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.2.0). Leave empty to use pyproject.toml."
        required: false
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Linux build
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libxcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0 \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libgtk-3-0 libgbm1 libasound2t64 \
            librsvg2-bin  # for icon generation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Prepare build environment
        run: |
          # hatchling's force-include in pyproject.toml requires this directory
          # to exist before building the wheel.  It gets populated later by the
          # frontend build step.
          mkdir -p vinastudio/server/static
          touch vinastudio/server/static/.gitkeep

      - name: Create virtualenv and install deps
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" pyinstaller cairosvg pillow

      - name: Build frontend
        run: |
          . .venv/bin/activate
          python scripts/build_web.py --skip-install

      - name: Generate icons
        run: |
          . .venv/bin/activate
          python packaging/ci/generate_icons.py

      - name: Build with PyInstaller
        run: |
          . .venv/bin/activate
          pyinstaller packaging/pyinstaller/vinastudio.spec --noconfirm

      - name: Assemble DEB package
        run: |
          . .venv/bin/activate
          python packaging/ci/bump-version.py
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          DIST_DIR="dist/vinastudio"
          DEB_ROOT="dist/deb-root"
          mkdir -p "$DEB_ROOT/opt/vinastudio" "$DEB_ROOT/usr/bin" \
                   "$DEB_ROOT/usr/share/applications" \
                   "$DEB_ROOT/usr/share/icons/hicolor/512x512/apps"
          cp -r "$DIST_DIR"/* "$DEB_ROOT/opt/vinastudio/"
          ln -sf /opt/vinastudio/vinastudio "$DEB_ROOT/usr/bin/vinastudio"
          cp packaging/linux/vinastudio.desktop "$DEB_ROOT/usr/share/applications/"
          cp packaging/linux/vinastudio.png "$DEB_ROOT/usr/share/icons/hicolor/512x512/apps/"
          # Build DEB
          DEB_PKG="dist/vinastudio_${VERSION}_amd64.deb"
          mkdir -p "dist/deb-root/DEBIAN"
          sed "s/^Version: .*/Version: $VERSION/" packaging/linux/debian/control \
            > "dist/deb-root/DEBIAN/control"
          cp packaging/linux/debian/postinst "dist/deb-root/DEBIAN/"
          cp packaging/linux/debian/prerm "dist/deb-root/DEBIAN/"
          dpkg-deb --root-owner-group --build "dist/deb-root" "$DEB_PKG"
          echo "DEB_PACKAGE=$DEB_PKG" >> "$GITHUB_ENV"

      - name: Create tarball
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tar -czf "dist/vinastudio-${VERSION}-linux-amd64.tar.gz" -C dist vinastudio
          echo "TARBALL=dist/vinastudio-${VERSION}-linux-amd64.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/vinastudio_*_amd64.deb
            dist/vinastudio-*-linux-amd64.tar.gz

  # ---------------------------------------------------------------------------
  # Windows build
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      # vina has no pre-built Windows wheels on PyPI and needs Boost C++ to compile.
      # Install Miniforge and use conda-forge for vina + rdkit + scientific deps.
      # Use PowerShell for reliable .exe execution.
      - name: Download Miniforge
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Windows-x86_64.exe" -OutFile "$env:TEMP\miniforge.exe"

      - name: Install Miniforge (silent)
        shell: pwsh
        run: |
          Start-Process -FilePath "$env:TEMP\miniforge.exe" -ArgumentList "/S","/D=C:\miniforge" -Wait -NoNewWindow
          Write-Host "Miniforge installed successfully"

      - name: Initialize conda
        shell: pwsh
        run: |
          & "C:\miniforge\Scripts\conda.exe" init powershell

      - name: Create conda environment and install scientific deps
        shell: pwsh
        run: |
          & "C:\miniforge\Scripts\conda.exe" create -n vinastudio python=${{ env.PYTHON_VERSION }} -y
          & "C:\miniforge\Scripts\conda.exe" install -n vinastudio -c conda-forge vina meeko rdkit numpy scipy gemmi -y

      - name: Install remaining deps via pip
        shell: pwsh
        run: |
          & "C:\miniforge\envs\vinastudio\Scripts\pip.exe" install pyside6 fastapi "uvicorn[standard]" pydantic python-multipart pyinstaller cairosvg pillow

      - name: Prepare build environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path vinastudio\server\static -Force
          New-Item -ItemType File -Path vinastudio\server\static\.gitkeep -Force

      - name: Install project in editable mode
        shell: pwsh
        run: |
          & "C:\miniforge\envs\vinastudio\Scripts\pip.exe" install -e ".[dev]"

      - name: Build frontend
        shell: pwsh
        run: |
          & "C:\miniforge\envs\vinastudio\Scripts\python.exe" scripts\build_web.py --skip-install

      - name: Generate icons
        shell: pwsh
        run: |
          & "C:\miniforge\envs\vinastudio\Scripts\python.exe" packaging\ci\generate_icons.py

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          & "C:\miniforge\envs\vinastudio\Scripts\pyinstaller.exe" packaging\pyinstaller\vinastudio.spec --noconfirm

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $VERSION = & "C:\miniforge\envs\vinastudio\Scripts\python.exe" -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$VERSION packaging\windows\vinastudio.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist\vinastudio-*-setup.exe

  # ---------------------------------------------------------------------------
  # Create GitHub Release
  # ---------------------------------------------------------------------------
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/vinastudio_*_amd64.deb
            dist/vinastudio-*-linux-amd64.tar.gz
            dist/vinastudio-*-setup.exe
